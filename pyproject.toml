[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "link-project-to-chat"
version = "1.2.0"
description = "Link a project directory to a Telegram bot that chats with Claude"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Rezo Imnadze", email = "rezo@imnadze.ge" },
]
keywords = ["claude", "telegram", "bot", "ai", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "python-telegram-bot>=22.0",
    "click>=8.0",
]

[project.optional-dependencies]
create = ["httpx>=0.27", "telethon>=1.36"]
voice = ["openai>=1.30"]
web = ["fastapi[standard]>=0.111", "jinja2>=3.1", "aiosqlite>=0.19"]
google-chat = [
  "fastapi[standard]>=0.111",
  "httpx>=0.27",
  "google-auth>=2.0",
]
all = ["httpx>=0.27", "telethon>=1.36", "openai>=1.30", "fastapi[standard]>=0.111", "jinja2>=3.1", "aiosqlite>=0.19", "google-auth>=2.0"]

[project.urls]
Homepage = "https://github.com/rimnadze/link-project-to-chat"
Repository = "https://github.com/rimnadze/link-project-to-chat"
Issues = "https://github.com/rimnadze/link-project-to-chat/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/link_project_to_chat"]

[tool.setuptools.package-data]
"link_project_to_chat" = ["personas/*.md"]

[project.scripts]
link-project-to-chat = "link_project_to_chat.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "codex_live: requires RUN_CODEX_LIVE=1 plus a real codex CLI installation and local authentication",
    "slow: tests that take noticeable wall-clock time, often spawning real subprocesses; opt-out via -m 'not slow'",
]
